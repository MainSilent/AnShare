<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnShare</title>
    <script src="/tailwind.js"></script>
</head>

<body class="bg-zinc-950 min-h-screen text-zinc-100">
    <div class="w-full max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-8">
        <!-- Main container -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-xl overflow-hidden">
            <!-- Header -->
            <div class="p-4 sm:p-6 border-b border-zinc-800">
                <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                    <div class="min-w-0">
                        <h1 class="text-2xl sm:text-3xl font-bold truncate">
                            AN Share
                        </h1>
                    </div>

                    <form action="/upload" method="post" enctype="multipart/form-data">
                        <label class="w-full sm:w-auto flex items-center justify-center gap-2 cursor-pointer bg-blue-600 hover:bg-blue-500 px-5 py-3 rounded-xl transition font-medium active:scale-95">
                            <span>＋ Upload</span>
                            <input 
                                type="file" 
                                name="file" 
                                class="hidden" 
                                onchange="this.form.submit()" 
                            />
                        </label>
                    </form>
                </div>
            </div>

            <!-- Path -->
            <div class="px-4 sm:px-6 py-3 border-b border-zinc-800 overflow-x-auto">
                <div class="flex items-center gap-2 text-sm whitespace-nowrap text-zinc-400" id="breadcrumb">

                </div>
            </div>

            <!-- Files -->
            <div class="p-4 sm:p-6 grid grid-cols-1 xs:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4" id="files">

            </div>
        </div>
    </div>

    <script>
        async function loadFiles() {
            const params = new URLSearchParams(window.location.search);

            // Current directory from ?path=
            // Default to root if no path was supplied.
            const currentPath = params.get("path") || "/storage/emulated/0/";

            const container = document.getElementById("files");

            container.innerHTML = `
                <div class="col-span-full text-zinc-500">
                    Loading...
                </div>
            `;

            try {
                const response = await fetch(
                    "/api/list?path=" + encodeURIComponent(currentPath)
                );

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                container.innerHTML = "";

                if (!data.files || data.files.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-zinc-500 text-center py-10">
                            This folder is empty.
                        </div>
                    `;
                    return;
                }

                // Add parent folder as the first item
                // For now i'm gonna show the .. to all dirs since it's also for rooted devices
                if (currentPath !== "/storage/emulated/0") {
                    const parentPath = currentPath.replace(/\/[^/]+\/?$/, "") || "/";

                    const parentElement = document.createElement("a");
                    parentElement.href = "?path=" + encodeURIComponent(parentPath);
                    parentElement.className =
                        "bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl p-4 transition group min-w-0";

                    parentElement.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="text-3xl">↩️</span>
                        </div>

                        <h3 class="mt-4 font-medium truncate">
                            ←
                        </h3>

                        <p class="text-xs text-zinc-500 mt-1">
                            GoBack
                        </p>
                    `;

                    container.appendChild(parentElement);
                }

                for (const item of data.files) {
                    const element = document.createElement("a");

                    if (item.type === "directory") {
                        // Folder
                        element.href = "?path=" + encodeURIComponent(item.path);

                        element.className =
                            "bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl p-4 transition group min-w-0";

                        element.innerHTML = `
                            <div class="flex items-center justify-between">
                                <span class="text-3xl"> 📁 </span>
                                <span class="text-zinc-500 group-hover:text-white"> → </span>
                            </div>

                            <h3 class="mt-4 font-medium truncate"> ${escapeHtml(item.name)} </h3>
                            <p class="text-xs text-zinc-500 mt-1"> Folder </p>
                        `;

                    } else {
                        // File
                        element.href =
                            "/api/download?path=" +
                            encodeURIComponent(item.path);

                        element.className =
                            "bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl p-4 transition group min-w-0";

                        element.innerHTML = `
                            <div class="flex items-center justify-between">
                                <span class="text-3xl">
                                    ${getFileIcon(item.name)}
                                </span>
                            </div>

                            <h3 class="mt-4 font-medium truncate">
                                ${escapeHtml(item.name)}
                            </h3>

                            <p class="text-xs text-zinc-500 mt-1">
                                ${formatSize(item.size)}
                            </p>
                        `;
                    }

                    container.appendChild(element);
                }

            } catch (error) {
                console.error("Failed to load files:", error);

                container.innerHTML = `
                    <div class="col-span-full text-red-400">
                        Failed to load directory.
                        <br>
                        <span class="text-sm text-zinc-500">
                            ${escapeHtml(error.message)}
                        </span>
                    </div>
                `;
            }
        }


        function getFileIcon(name) {
            const ext = name.split(".").pop().toLowerCase();

            if (["mp4", "mkv", "avi", "mov", "webm"].includes(ext))
                return "🎞️";

            if (["mp3", "wav", "flac", "aac", "ogg", "m4a"].includes(ext))
                return "🎵";

            if (["jpg", "jpeg", "png", "gif", "webp", "svg"].includes(ext))
                return "🖼️";

            if (["pdf"].includes(ext))
                return "📄";

            if (["zip", "rar", "7z", "tar", "gz"].includes(ext))
                return "📦";

            if (["txt", "md", "json", "xml", "csv"].includes(ext))
                return "📝";

            if (["js", "ts", "html", "css", "jsx", "tsx"].includes(ext))
                return "💻";

            return "📄";
        }


        function formatSize(bytes) {
            bytes = Number(bytes);

            if (!Number.isFinite(bytes) || bytes < 0)
                return "Unknown size";

            if (bytes < 1024)
                return bytes + " B";

            if (bytes < 1024 * 1024)
                return (bytes / 1024).toFixed(1) + " KB";

            if (bytes < 1024 * 1024 * 1024)
                return (bytes / (1024 * 1024)).toFixed(1) + " MB";

            if (bytes < 1024 * 1024 * 1024 * 1024)
                return (bytes / (1024 * 1024 * 1024)).toFixed(1) + " GB";

            return (bytes / (1024 * 1024 * 1024 * 1024)).toFixed(1) + " TB";
        }


        // Prevent filenames from being interpreted as HTML.
        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        // Load when the page is ready.
        document.addEventListener("DOMContentLoaded", loadFiles);
    </script>

    <!-- THis is for BreadCrumb -->
     <script>
        function loadBreadcrumb(path) {
            const root = "/storage/emulated/0";
            path = path.replace(/\/+$/, "") || root;

            const parts = path.slice(root.length).split("/").filter(Boolean);
            const breadcrumb = document.getElementById("breadcrumb");

            breadcrumb.innerHTML = `
                <a href="?path=${encodeURIComponent(root)}" class="hover:text-white">
                    Home
                </a>
            `;

            let current = root;

            parts.forEach((part, i) => {
                current += "/" + part;

                breadcrumb.innerHTML += `
                    <span>/</span>
                    <a href="?path=${encodeURIComponent(current)}"
                    class="${i === parts.length - 1 ? "text-white" : "hover:text-white"}">
                        ${escapeHtml(part)}
                    </a>
                `;
            });
        }

        const params = new URLSearchParams(location.search);
        loadBreadcrumb(params.get("path") || "/storage/emulated/0/");
    </script>
</body>
</html>
