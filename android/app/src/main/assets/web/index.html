<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnShare</title>
    <script src="/tailwind.js"></script>
</head>

<body class="bg-zinc-950 min-h-screen text-zinc-100">
    <div class="w-full max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-8">
        <!-- Main container -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-xl overflow-hidden">
            <!-- Header -->
            <div class="p-4 sm:p-6 border-b border-zinc-800">
                <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                    <div class="min-w-0">
                        <h1 class="text-2xl sm:text-3xl font-bold truncate">
                            AN Share
                        </h1>
                    </div>

                    <label
                        class="w-full sm:w-auto flex items-center justify-center gap-2 cursor-pointer bg-blue-600 hover:bg-blue-500 px-5 py-3 rounded-xl transition font-medium active:scale-95"
                    >
                        <span>＋ Upload</span>

                        <input
                            id="fileInput"
                            type="file"
                            class="hidden"
                            onchange="uploadFile(this.files[0])"
                        />
                    </label>
                </div>
            </div>

            <!-- Path -->
            <div class="px-4 sm:px-6 py-3 border-b border-zinc-800 overflow-x-auto">
                <div class="flex items-center gap-2 text-sm whitespace-nowrap text-zinc-400" id="breadcrumb">

                </div>
            </div>

            <!-- Files -->
            <div class="p-4 sm:p-6 grid grid-cols-1 xs:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4" id="files">

            </div>
        </div>
    </div>

    <!-- Upload Progress Modal -->
    <div
        id="uploadModal"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm px-4"
    >
        <div
            class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl p-6"
        >
            <div class="flex items-center justify-between mb-5">
                <div>
                    <h2 class="text-lg font-semibold">
                        Uploading
                    </h2>

                    <p
                        id="uploadFileName"
                        class="text-sm text-zinc-500 mt-1 truncate"
                    >
                        File
                    </p>
                </div>

                <span
                    id="uploadPercent"
                    class="text-sm font-medium text-zinc-300"
                >
                    0%
                </span>
            </div>

            <!-- Progress bar -->
            <div class="w-full h-3 bg-zinc-800 rounded-full overflow-hidden">
                <div
                    id="uploadProgress"
                    class="h-full bg-blue-600 rounded-full transition-all duration-200"
                    style="width: 0%"
                ></div>
            </div>

            <div class="flex justify-between mt-3 text-xs text-zinc-500">
                <span id="uploadStatus">
                    Preparing upload...
                </span>

                <span id="uploadSize">
                    0 B / 0 B
                </span>
            </div>

            <!-- Close button appears after upload -->
            <button
                id="uploadClose"
                type="button"
                onclick="closeUploadModal()"
                class="hidden w-full mt-6 bg-zinc-800 hover:bg-zinc-700 px-4 py-3 rounded-xl transition"
            >
                Close
            </button>
        </div>
    </div>

    <script>
        async function loadFiles() {
            const params = new URLSearchParams(window.location.search);

            // Current directory from ?path=
            // Default to root if no path was supplied.
            const currentPath = params.get("path") || "/storage/emulated/0/";

            const container = document.getElementById("files");

            container.innerHTML = `
                <div class="col-span-full text-zinc-500">
                    Loading...
                </div>
            `;

            try {
                const response = await fetch(
                    "/api/list?path=" + encodeURIComponent(currentPath)
                );

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                container.innerHTML = "";

                if (!data.files || data.files.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-zinc-500 text-center py-10">
                            This folder is empty.
                        </div>
                    `;
                    return;
                }

                // Add parent folder as the first item
                // For now i'm gonna show the .. to all dirs since it's also for rooted devices
                if (currentPath !== "/storage/emulated/0") {
                    const parentPath = currentPath.replace(/\/[^/]+\/?$/, "") || "/";

                    const parentElement = document.createElement("a");
                    parentElement.href = "?path=" + encodeURIComponent(parentPath);
                    parentElement.className =
                        "bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl p-4 transition group min-w-0";

                    parentElement.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="text-3xl">↩️</span>
                        </div>

                        <h3 class="mt-4 font-medium truncate">
                            ←
                        </h3>

                        <p class="text-xs text-zinc-500 mt-1">
                            GoBack
                        </p>
                    `;

                    container.appendChild(parentElement);
                }

                for (const item of data.files) {
                    const element = document.createElement("a");

                    if (item.type === "directory") {
                        // Folder
                        element.href = "?path=" + encodeURIComponent(item.path);

                        element.className =
                            "bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl p-4 transition group min-w-0";

                        element.innerHTML = `
                            <div class="flex items-center justify-between">
                                <span class="text-3xl"> 📁 </span>
                                <span class="text-zinc-500 group-hover:text-white"> → </span>
                            </div>

                            <h3 class="mt-4 font-medium truncate"> ${escapeHtml(item.name)} </h3>
                            <p class="text-xs text-zinc-500 mt-1"> Folder </p>
                        `;

                    } else {
                        // File
                        element.href =
                            "/api/download?path=" +
                            encodeURIComponent(item.path);

                        element.className =
                            "bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl p-4 transition group min-w-0";

                        element.innerHTML = `
                            <div class="flex items-center justify-between">
                                <span class="text-3xl">
                                    ${getFileIcon(item.name)}
                                </span>
                            </div>

                            <h3 class="mt-4 font-medium truncate">
                                ${escapeHtml(item.name)}
                            </h3>

                            <p class="text-xs text-zinc-500 mt-1">
                                ${formatSize(item.size)}
                            </p>
                        `;
                    }

                    container.appendChild(element);
                }

            } catch (error) {
                console.error("Failed to load files:", error);

                container.innerHTML = `
                    <div class="col-span-full text-red-400">
                        Failed to load directory.
                        <br>
                        <span class="text-sm text-zinc-500">
                            ${escapeHtml(error.message)}
                        </span>
                    </div>
                `;
            }
        }


        function getFileIcon(name) {
            const ext = name.split(".").pop().toLowerCase();

            if (["mp4", "mkv", "avi", "mov", "webm"].includes(ext))
                return "🎞️";

            if (["mp3", "wav", "flac", "aac", "ogg", "m4a"].includes(ext))
                return "🎵";

            if (["jpg", "jpeg", "png", "gif", "webp", "svg"].includes(ext))
                return "🖼️";

            if (["pdf"].includes(ext))
                return "📄";

            if (["zip", "rar", "7z", "tar", "gz"].includes(ext))
                return "📦";

            if (["txt", "md", "json", "xml", "csv"].includes(ext))
                return "📝";

            if (["js", "ts", "html", "css", "jsx", "tsx"].includes(ext))
                return "💻";

            return "📄";
        }


        function formatSize(bytes) {
            bytes = Number(bytes);

            if (!Number.isFinite(bytes) || bytes < 0)
                return "Unknown size";

            if (bytes < 1024)
                return bytes + " B";

            if (bytes < 1024 * 1024)
                return (bytes / 1024).toFixed(1) + " KB";

            if (bytes < 1024 * 1024 * 1024)
                return (bytes / (1024 * 1024)).toFixed(1) + " MB";

            if (bytes < 1024 * 1024 * 1024 * 1024)
                return (bytes / (1024 * 1024 * 1024)).toFixed(1) + " GB";

            return (bytes / (1024 * 1024 * 1024 * 1024)).toFixed(1) + " TB";
        }


        // Prevent filenames from being interpreted as HTML.
        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        // Load when the page is ready.
        document.addEventListener("DOMContentLoaded", loadFiles);
    </script>

    <!-- THis is for BreadCrumb -->
     <script>
        function loadBreadcrumb(path) {
            const root = "/storage/emulated/0";
            path = path.replace(/\/+$/, "") || root;

            const parts = path.slice(root.length).split("/").filter(Boolean);
            const breadcrumb = document.getElementById("breadcrumb");

            breadcrumb.innerHTML = `
                <a href="?path=${encodeURIComponent(root)}" class="hover:text-white">
                    Home
                </a>
            `;

            let current = root;

            parts.forEach((part, i) => {
                current += "/" + part;

                breadcrumb.innerHTML += `
                    <span>/</span>
                    <a href="?path=${encodeURIComponent(current)}"
                    class="${i === parts.length - 1 ? "text-white" : "hover:text-white"}">
                        ${escapeHtml(part)}
                    </a>
                `;
            });
        }

        const params = new URLSearchParams(location.search);
        loadBreadcrumb(params.get("path") || "/storage/emulated/0/");
    </script>

    <!-- THis is for upload -->
     <script>
        function uploadFile(file) {
            if (!file) return;

            const params = new URLSearchParams(window.location.search);

            const currentPath =
                params.get("path") || "/storage/emulated/0";

            const cleanPath = currentPath.replace(/\/+$/, "");

            const filePath = cleanPath + "/" + file.name;

            const modal = document.getElementById("uploadModal");
            const progress = document.getElementById("uploadProgress");
            const percent = document.getElementById("uploadPercent");
            const fileName = document.getElementById("uploadFileName");
            const status = document.getElementById("uploadStatus");
            const size = document.getElementById("uploadSize");
            const closeButton = document.getElementById("uploadClose");

            // Reset modal
            modal.classList.remove("hidden");
            modal.classList.add("flex");

            progress.style.width = "0%";
            percent.textContent = "0%";
            fileName.textContent = file.name;
            status.textContent = "Starting upload...";
            size.textContent = "0 B / " + formatSize(file.size);

            closeButton.classList.add("hidden");

            const xhr = new XMLHttpRequest();

            xhr.open(
                "POST",
                "/api/upload?path=" + encodeURIComponent(filePath)
            );

            xhr.setRequestHeader(
                "Content-Type",
                "application/octet-stream"
            );

            // Upload progress
            xhr.upload.addEventListener("progress", function (event) {
                if (!event.lengthComputable) {
                    return;
                }

                const percentValue =
                    Math.round((event.loaded / event.total) * 100);

                progress.style.width = percentValue + "%";
                percent.textContent = percentValue + "%";

                size.textContent =
                    formatSize(event.loaded) +
                    " / " +
                    formatSize(event.total);

                if (percentValue < 100) {
                    status.textContent = "Uploading...";
                } else {
                    status.textContent = "Finishing...";
                }
            });

            xhr.addEventListener("load", async function () {
                if (xhr.status >= 200 && xhr.status < 300) {
                    progress.style.width = "100%";
                    percent.textContent = "100%";
                    status.textContent = "Upload complete";
                    size.textContent =
                        formatSize(file.size) +
                        " / " +
                        formatSize(file.size);

                    closeButton.classList.remove("hidden");

                    // Refresh directory
                    await loadFiles();

                } else {
                    status.textContent =
                        "Upload failed (HTTP " + xhr.status + ")";

                    closeButton.classList.remove("hidden");
                }
            });

            xhr.addEventListener("error", function () {
                status.textContent = "Upload failed — connection error";
                closeButton.classList.remove("hidden");
            });

            xhr.addEventListener("abort", function () {
                status.textContent = "Upload cancelled";
                closeButton.classList.remove("hidden");
            });

            xhr.send(file);
        }

        function closeUploadModal() {
            const modal = document.getElementById("uploadModal");

            modal.classList.add("hidden");
            modal.classList.remove("flex");

            // Reset file input
            const input = document.getElementById("fileInput");

            if (input) {
                input.value = "";
            }
        }
     </script>
</body>
</html>
